[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "word-replica"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "lxml>=5,<7",
  "python-docx>=1.1,<2",
  "platformdirs>=4,<5",
  "pypdfium2>=4,<6",
  "Pillow>=10,<13",
  "Jinja2>=3.1,<4",
  "pywin32>=306; sys_platform == 'win32'",
  "cryptography>=50,<51",
  "rfc8785>=0.1.4,<0.2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=5,<8"]
gui = ["PySide6>=6.8,<7"]
build = ["pyinstaller>=6,<8"]

[project.scripts]
word-replica = "word_replica.cli:main"
word-replica-gui = "word_replica.gui.app:main"
word-replica-desktop = "word_replica.desktop:main"

[tool.setuptools.package-data]
word_replica = ["repair_contract/fixer_ids.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["word: requires Windows + Microsoft Word desktop"]
